<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planlayıcı · Çevrimdışı</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e2e8f0; } p { color: #94a3b8 !important; } }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
  p { color: #64748b; line-height: 1.5; }
  button { margin-top: 1rem; min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>İnternet bağlantısı yok</h1>
  <p>Planlayıcı verilerini bulutta tuttuğu için bağlantı gerekiyor. Bağlantı gelince kaldığın yerden devam edebilirsin.</p>
  <button onclick="location.reload()">Tekrar dene</button>
</main>
</body>
</html>
